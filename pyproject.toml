[project]
name = "mcp-1c-local-bridge"
version = "1.0.0"
description = "Локальный MCP-мост к открытому сеансу 1С через внешнюю обработку, без промежуточного шлюза"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.20,<2",
]

[project.scripts]
mcp-1c-local-bridge = "mcp_1c_local_bridge.server:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_1c_local_bridge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
